server {
    server_name 59.110.40.50 makebetter.top localhost;

    # Static files served directly by Nginx (both /static/ and /g1/static/)
    location /static/ {
        alias /home/jack/workspace/governor_game/governor_game/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /g1/static/ {
        alias /home/jack/workspace/governor_game/governor_game/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API calls — JS uses hardcoded /api/ paths, also reachable at /g1/api/ via the /g1/ block below
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
    }

    # LLM Bench tool
    location /llm-bench/ {
        proxy_pass http://127.0.0.1:8001/llm-bench/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
    }

    # Redirect /g1 → /g1/
    location = /g1 {
        return 301 /g1/;
    }

    # Game SPA + admin + all other paths — strip /g1 prefix before passing to Gunicorn
    location /g1/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/makebetter.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/makebetter.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = makebetter.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 59.110.40.50 makebetter.top localhost;
    return 404; # managed by Certbot
}
